# AR spike home layer (isolated DSH_HOME — never the daily ~/.dsh).
# Mount the out-of-tree @knevo hello plugin to prove the AR plugin layer loads.
- insert:
    - id: ar-hello
      name: '@knevo/dsh-ar-hello'

# Pin the BROWSE directory-picker pair (same fix as the daily ~/.dsh instance):
# the workspace file tree/preview reads are served only under the browse
# capability, and on win32+loopback the auto chooser resolves to native —
# without this the file tree shows 读取失败. Pinning = disable the chooser row
# and compose the interaction pair directly.
- id: directory-picker
  name: '@deepseek-ai/dsh-host-directory-picker-auto'
  disabled: true
- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'

# 接线①: 主 LLM 通道换轨到 AR agent_gateway 代理。
# adapter 把 apiKeyEnv(AR_DEVICE_TOKEN 环境变量)解析出的设备 token 当 Bearer 发给
# baseURL/chat/completions —— 正是 gateway 的 device_auth 期望的设备 token。
# 真实 DeepSeek key 只在 gateway 侧;设备侧绝不出现任何明文 token/常量(分发包尤其)。
- id: llm-deepseek
  config:
    baseURL: https://dev.ar.knevo.ai/api/agent/v1/llm/deepseek
    apiKeyEnv: AR_DEVICE_TOKEN

# 产品形态锁死模型/供应商:LLM 一律走我们的网关(平台 key + per-user 计量),
# 不给用户改模型或自定义供应商 —— 关掉设置里的「模型」页与对话里的模型选择器。
# 这只是产品面:设备归用户所有,settings.yaml 仍可手改,真正的边界是网关侧的
# 模型白名单(AGENT_GATEWAY_ALLOWED_MODELS,非白名单 400)。
- id: ui-settings-models
  disabled: true
- id: ui-model-selection
  disabled: true

# 主循环模型对齐 AR 产品:base 的 agent-default-model 钉的是 deepseek-v4-flash,
# 研究产品主模型是 v4-pro(实测设备端 turns 都记在 flash 上,质量掉档)。
# 注意:此行 config 覆写不是 merge,schema 要求 provider+model 都给全,缺 provider 会
# ValidationError 直接 boot 失败(0.2.1 就栽在这)。
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

# 联网搜索换轨: base bundle 把 web 接缝 pin 到 deepseek-official 官方 provider。
# 改选我们的 ar-remote(打 gateway /search,平台持搜索 key);官方 provider 禁掉,
# 避免两个可用 provider 触发 WEB_PROVIDER_AMBIGUOUS。
- id: web
  config:
    searchProvider: ar-remote
    fetchProvider: http
- id: web-search-deepseek
  disabled: true
# 启用 web_fetch:base 里 tool-web fetch:false 且未挂任何 fetch provider。
# 开 fetch + 挂 dsh 原生 web-fetch-http(在设备本地/用户 IP 抓公网页,provider id=http)。
# 内网/登录态/本地地址天然只能设备抓;公网页也走设备(爆炸半径自包含、反爬友好)。
- id: tool-web
  config:
    fetch: true
- insert:
    - id: web-fetch-http
      name: '@deepseek-ai/dsh-web-fetch-http'

# 产品化:默认 agent 组成换成我们自己的 preset(随包发在 .dsh-home/.agent-presets/knevo)。
# 人格、子 agent、web_fetch 都在 preset 层 —— 上游 standard 预设是"编码 agent"人格
# 且把 web_fetch 关了,直接用它的话产品就是"接了我们 provider 的 dsh"。
- id: agent-presets
  config:
    default: knevo

# 去掉 dsh 自带的身份句("You are an AI agent powered by DeepSeek Harness."),
# 人格由 preset 的 persona 提供(order 0),身份句在 order -100。
- id: system-prompt
  config:
    includeHarnessIdentity: false
    # 与 preset 的 persona 同一份文本:preset 生效时由 preset 覆盖(它 shadow 部署默认),
    # 不走 roster 的入口(如 headless)则由这里兜底 —— 否则会退回模型自己的通用身份。
    persona: |-
      You are Oryx-RE, Knevo's long-horizon research assistant, running on {{model}}. Your working directory is {{cwd}}.

      研究纪律(高于一切):
      - 结论必须有来源。用 web_search 检索、web_fetch 抓正文核实;引用只能是你**真实抓取过**的链接,绝不凭记忆编造 URL、标题或数字。
      - 交叉验证。关键事实至少两个独立来源;来源冲突时把分歧写出来,不要偷偷选一个。
      - 诚实标注不确定。查不到就说查不到,不要用推测填补证据缺口。
      - 时间敏感的问题先确认"最新"的时点,别把旧结论当现状。

      工作方式:
      - 长任务先用 todo_write 拆解,按步推进;目标状态用 goal 工具维护,不靠对话记忆。
      - 可并行、可隔离的子问题用 subagent 分工(各自带回证据与来源),你负责汇总与裁决。
      - 重要发现用 research_memory_write 记入长期记忆(带来源 URL),后续会话会自动检索回来。
      - 下重要结论、交付报告前,用 peer_review 请独立模型审一遍,并按意见修正。

      产出:
      - 报告、数据、图表一律写进工作区文件(write/edit 工具),路径用工作区相对路径,不要用本机绝对路径。
      - 正文里给出可点击的真实引用链接;必要时附来源清单。
      - 回复用用户使用的语言;先给结论,再给依据,最后给不确定性与后续建议。

# 接线②: 会话事件流上云。sessionTelemetry 是单例,默认 otel backend 占了,先 disable。
- id: session-telemetry-otel
  disabled: true
# 注册 @knevo telemetry backend(session-telemetry seam),每个会话事件按 seq 水位
# POST 到 agent_telemetry。数据一律上云。
- insert:
    - id: ar-telemetry
      name: '@knevo/dsh-ar-telemetry'
      config:
        endpoint: https://dev.ar.knevo.ai/api/agent/v1/trace/events
        token: !!js process.env.AR_DEVICE_TOKEN || 'ar-spike-2026'
# 接线③: 技能远程 provider —— 从 agent_gateway 拉技能目录/正文(与本地 skill-filesystem 共存)。
    - id: ar-skills-remote
      name: '@knevo/dsh-ar-skills-remote'
      config:
        baseUrl: https://dev.ar.knevo.ai/api/agent/v1
        token: !!js process.env.AR_DEVICE_TOKEN || 'ar-spike-2026'
# 接线③: 记忆注入 —— pre-step 拉 /memories/rank，把相关记忆作 user 消息注入本回合。
    - id: ar-memory
      name: '@knevo/dsh-ar-memory'
      config:
        endpoint: https://dev.ar.knevo.ai/api/agent/v1/memories/rank
        token: !!js process.env.AR_DEVICE_TOKEN || 'ar-spike-2026'
# 生图工具: generate_image → gateway /images → 写工作区 → 文件区预览
    - id: ar-image
      name: '@knevo/dsh-ar-image'
      config:
        endpoint: https://dev.ar.knevo.ai/api/agent/v1/images
        token: !!js process.env.AR_DEVICE_TOKEN || 'ar-spike-2026'
# 联网搜索 provider: dsh 原生 tool-web 的 web_search → ctx.web → 本 provider → gateway /search
# （平台持 Tavily/火山 key + 计量）。web_fetch 走 dsh 原生 web-fetch-http（设备/用户 IP），不在此。
    - id: ar-web-search
      name: '@knevo/dsh-ar-web-search'
      config:
        baseUrl: https://dev.ar.knevo.ai/api/agent/v1
        token: !!js process.env.AR_DEVICE_TOKEN || 'ar-spike-2026'
# peer_review: 拼上下文 → 调统一 /llm 的 review channel(平台持 grok key,跨模型独立审)。
    - id: ar-peer-review
      name: '@knevo/dsh-ar-peer-review'
      config:
        endpoint: https://dev.ar.knevo.ai/api/agent/v1/llm/review/chat/completions
        token: !!js process.env.AR_DEVICE_TOKEN || 'ar-spike-2026'
        model: x-ai/grok-4.5
# 接线④: compaction —— ctx.compaction 单例,disable 默认 basic,装 AR 提示词版。
- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  disabled: true
- insert:
    - id: ar-compact
      name: '@knevo/dsh-ar-compact'
    - id: ar-goals-judge
      name: '@knevo/dsh-ar-goals-judge'
